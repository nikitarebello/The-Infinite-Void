<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — The Infinite Void</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-container {
      max-width: 800px;
      margin: 40px auto;
      background: var(--paper-color);
      border: 2px solid var(--border-color);
      padding: 40px;
    }
    .admin-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-header h1 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
    }
    .success-banner {
      display: none;
      background: #111;
      color: #fff;
      padding: 12px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="top-bar">
      <div class="date-issue">BACKEND ADMINISTRATION</div>
      <div class="header-controls">
        <a href="index.html" class="nav-btn">&larr; View Live Website</a>
      </div>
    </div>
  </header>

  <div class="admin-container">
    <div class="admin-header">
      <h1>Publish New Article</h1>
      <span style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;">Secure CMS</span>
    </div>

    <div id="success-banner" class="success-banner">
      Article successfully published! Remember to copy the updated array from your browser console or save it into your local <code>data.js</code> file before pushing to GitHub.
    </div>

    <form id="admin-article-form">
      <div class="form-group">
        <label for="form-title">Article Title</label>
        <input type="text" id="form-title" required placeholder="e.g. THE ILLUSION OF TEMPORAL FLOW" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="form-category">Category</label>
          <select id="form-category" required>
            <option value="philosophy">Philosophy</option>
            <option value="physics">Physics</option>
            <option value="mathematics">Mathematics</option>
          </select>
        </div>
        <div class="form-group">
          <label for="form-date">Date Display</label>
          <input type="text" id="form-date" placeholder="e.g. OCTOBER 2026" />
        </div>
      </div>

      <div class="form-group">
        <label for="form-excerpt">Front Page Extract / Excerpt</label>
        <textarea id="form-excerpt" rows="2" required placeholder="Short snippet displayed directly under the title on the main page..."></textarea>
      </div>

      <div class="form-group">
        <label for="form-quote">Pull Quote (Left Page Spread)</label>
        <textarea id="form-quote" rows="2" placeholder="Key quotation displayed in the left page block..."></textarea>
      </div>

      <div class="form-group">
        <label for="form-content">Full Article Body Content (Separate paragraphs with double enter)</label>
        <textarea id="form-content" rows="10" required placeholder="Write your full article essay here..."></textarea>
      </div>

      <div class="form-group">
        <label for="form-tags">Hidden Tags (Comma separated for searchability)</label>
        <input type="text" id="form-tags" placeholder="e.g. time, metaphysics, consciousness" />
      </div>

      <div class="modal-footer" style="justify-content: flex-start;">
        <button type="submit" class="primary-btn" style="width: 100%; padding: 12px; font-size: 0.9rem;">Publish to Repository</button>
      </div>
    </form>
  </div>

  <script src="data.js"></script>
  <script>
    document.getElementById('admin-article-form').onsubmit = (e) => {
      e.preventDefault();

      const title = document.getElementById('form-title').value;
      const category = document.getElementById('form-category').value;
      const date = document.getElementById('form-date').value || 'OCTOBER 2026';
      const excerpt = document.getElementById('form-excerpt').value;
      const quote = document.getElementById('form-quote').value;
      const body = document.getElementById('form-content').value;
      const tagsRaw = document.getElementById('form-tags').value;
      
      const tags = tagsRaw.split(',').map(t => t.trim().toLowerCase()).filter(t => t);

      const newArt = {
        id: 'art_' + Date.now(),
        category,
        title: title.toUpperCase(),
        date,
        excerpt,
        quote,
        body,
        tags
      };

      // Add to local articles array & save to localStorage so the live site picks it up immediately
      let existingArticles = JSON.parse(localStorage.getItem('iv_articles')) || articles;
      existingArticles.unshift(newArt);
      localStorage.setItem('iv_articles', JSON.stringify(existingArticles));

      // Show instructions on how to permanently save to data.js for GitHub
      console.log("UPDATED ARTICLES ARRAY (Copy this into data.js):", JSON.stringify(existingArticles, null, 2));

      document.getElementById('success-banner').style.display = 'block';
      document.getElementById('admin-article-form').reset();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  </script>
</body>
</html>
