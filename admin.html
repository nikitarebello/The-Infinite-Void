<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal — The Infinite Void</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-wrapper {
      max-width: 800px;
      margin: 40px auto;
      background: var(--paper-color);
      border: 2px solid var(--border-color);
      padding: 40px;
    }
    .admin-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-header h1 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
    }
    .success-banner {
      display: none;
      background: var(--ink-color);
      color: var(--paper-color);
      padding: 12px;
      font-size: 0.85srem;
      margin-bottom: 20px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    /* Login Gate Overlay */
    #login-gate {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .login-box {
      background: var(--paper-color);
      border: 2px solid var(--border-color);
      padding: 30px;
      width: 100%;
      max-width: 400px;
    }
    .login-box h2 {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    .login-error {
      color: #b00;
      font-size: 0.75rem;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- PASSWORD LOGIN GATE -->
  <div id="login-gate">
    <div class="login-box">
      <h2>Restricted Access</h2>
      <p style="font-size: 0.85rem; color: var(--muted-ink); margin-bottom: 15px;">Enter your admin password to access the CMS portal.</p>
      <form id="login-form">
        <div class="form-group">
          <input type="password" id="admin-pass-input" required placeholder="Enter Password..." />
        </div>
        <div id="login-error" class="login-error">Incorrect password. Please try again.</div>
        <button type="submit" class="primary-btn" style="width:100%; margin-top:10px;">Authenticate</button>
      </form>
    </div>
  </div>

  <header class="site-header">
    <div class="top-bar">
      <div class="date-issue">BACKEND ADMINISTRATION</div>
      <div class="header-controls">
        <button id="logout-btn" class="nav-btn" style="margin-right: 10px;">Lock Session</button>
        <a href="index.html" class="nav-btn">&larr; View Live Website</a>
      </div>
    </div>
  </header>

  <div class="admin-wrapper">
    <div class="admin-header">
      <h1>Publish New Article</h1>
      <span style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;">Auto-Deploy Enabled</span>
    </div>

    <div id="success-banner" class="success-banner">
      Article successfully published and auto-formatted live!
    </div>

    <form id="admin-article-form">
      <div class="form-group">
        <label for="form-title">Article Title</label>
        <input type="text" id="form-title" required placeholder="e.g. THE ILLUSION OF TEMPORAL FLOW" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="form-category">Category</label>
          <select id="form-category" required>
            <option value="philosophy">Philosophy</option>
            <option value="physics">Physics</option>
            <option value="mathematics">Mathematics</option>
          </select>
        </div>
        <div class="form-group">
          <label for="form-date">Date Display</label>
          <input type="text" id="form-date" placeholder="e.g. OCTOBER 2026" />
        </div>
      </div>

      <div class="form-group">
        <label for="form-excerpt">Front Page Extract / Excerpt</label>
        <textarea id="form-excerpt" rows="2" required placeholder="Short snippet displayed directly under the title on the main page..."></textarea>
      </div>

      <div class="form-group">
        <label for="form-quote">Pull Quote (Left Page Spread)</label>
        <textarea id="form-quote" rows="2" placeholder="Key quotation displayed in the left page block..."></textarea>
      </div>

      <div class="form-group">
        <label for="form-content">Full Article Body Content (Separate paragraphs with double enter)</label>
        <textarea id="form-content" rows="10" required placeholder="Write your full article essay here..."></textarea>
      </div>

      <div class="form-group">
        <label for="form-tags">Hidden Tags (Comma separated for searchability)</label>
        <input type="text" id="form-tags" placeholder="e.g. time, metaphysics, consciousness" />
      </div>

      <div class="modal-footer" style="justify-content: flex-start;">
        <button type="submit" class="primary-btn" style="width: 100%; padding: 12px; font-size: 0.9rem;">Publish Article Live</button>
      </div>
    </form>
  </div>

  <script src="data.js"></script>
  <script>
    // SET YOUR ADMIN PASSWORD HERE:
    const ADMIN_PASSWORD = "Xfinity+1"; 

    const loginGate = document.getElementById('login-gate');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    // Check if session is already authenticated
    if (sessionStorage.getItem('iv_authenticated') === 'true') {
      loginGate.style.display = 'none';
    }

    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const enteredPass = document.getElementById('admin-pass-input').value;
      if (enteredPass === ADMIN_PASSWORD) {
        sessionStorage.setItem('iv_authenticated', 'true');
        loginGate.style.display = 'none';
        loginError.style.display = 'none';
      } else {
        loginError.style.display = 'block';
      }
    };

    document.getElementById('logout-btn').onclick = () => {
      sessionStorage.removeItem('iv_authenticated');
      location.reload();
    };

    // Form Submission & Auto-Formatting Logic
    document.getElementById('admin-article-form').onsubmit = (e) => {
      e.preventDefault();

      const title = document.getElementById('form-title').value;
      const category = document.getElementById('form-category').value;
      const date = document.getElementById('form-date').value || 'OCTOBER 2026';
      const excerpt = document.getElementById('form-excerpt').value;
      const quote = document.getElementById('form-quote').value;
      const body = document.getElementById('form-content').value;
      const tagsRaw = document.getElementById('form-tags').value;
      
      const tags = tagsRaw.split(',').map(t => t.trim().toLowerCase()).filter(t => t);

      const newArt = {
        id: 'art_' + Date.now(),
        category,
        title: title.toUpperCase(),
        date,
        excerpt,
        quote,
        body,
        tags
      };

      // Load existing articles from localStorage or fallback to base data.js
      let existingArticles = JSON.parse(localStorage.getItem('iv_articles')) || articles;
      existingArticles.unshift(newArt);
      
      // Save instantly back to localStorage so index.html displays it immediately
      localStorage.setItem('iv_articles', JSON.stringify(existingArticles));

      const banner = document.getElementById('success-banner');
      banner.style.display = 'block';
      document.getElementById('admin-article-form').reset();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      setTimeout(() => {
        banner.style.display = 'none';
      }, 4000);
    };
  </script>
</body>
</html>
